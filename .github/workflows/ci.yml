name: Compilation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compiler
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja "-DCMAKE_BUILD_TYPE=Release" "-DSK_APP_VERSION=0.0.1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SlayerKit-${{ github.sha }}
          path: build/SlayerKit.exe
